<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Mía Digital</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="contenedor">

    <header>

        <img src="imagenes/Logo.png" class="logo" alt="Casa Mía">

        <h1>CASA MÍA</h1>

        <p>La mesa está servida, siéntete en casa.</p>

    </header>

    <section class="menu">

        <div class="tarjeta" id="pizzas">

            <img src="imagenes/pizzas/portada.jpg">

            <div class="titulo">
                🍕 PIZZAS
            </div>

        </div>

        <div class="tarjeta" id="pastas">

            <img src="imagenes/pastas/portada.jpg">

            <div class="titulo">
                🍝 PASTAS
            </div>

        </div>

        <div class="tarjeta" id="lasagna">

            <img src="imagenes/lasagna/portada.jpg">

            <div class="titulo">
                🥘 LASAÑA
            </div>

        </div>

        <div class="tarjeta" id="bebidas">

            <img src="imagenes/bebidas/portada.jpg">

            <div class="titulo">
                🥤 BEBIDAS
            </div>

        </div>

        <div class="tarjeta" id="promociones">

            <img src="imagenes/promociones/portada.jpg">

            <div class="titulo">
                ⭐ PROMOCIONES
            </div>

        </div>

    </section>

</div>

<script src="js/script.js"></script>

</body>
