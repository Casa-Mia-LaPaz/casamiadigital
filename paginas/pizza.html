<!DOCTYPE html>
<html lang="es">

<head>

    <title>Pizza - Casa Mía</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="contenedor">

    <header>
        <img src="../imagenes/logo.png" class="logo" alt="Casa Mía">
        <h1 id="nombrePizza">PIZZA</h1>
        <p id="descripcionPizza">Descripción</p>
    </header>

    <div class="tarjeta">
        <img id="imagenPizza" src="" alt="Pizza">
    </div>

    <div class="tarjeta" style="padding:20px;">
        <h2>Elige el tamaño</h2>

        <p>🍕 4 porciones — <strong>Bs 47</strong></p>

        <br>

        <button style="width:100%; padding:15px; font-size:18px; background:#b22222; color:white; border:none; border-radius:10px;">
            AGREGAR AL PEDIDO
        </button>
    </div>

    <br>

    <button onclick="history.back()" style="width:100%; padding:12px; font-size:16px;">
        ← Volver a Pizzas
    </button>

</div>
